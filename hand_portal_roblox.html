<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Roblox Hand Portal</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font: 600 14px/1.4 "Builder Sans", "Gotham", ui-sans-serif, system-ui, sans-serif;
        color: #fff;
      }
      video {
        display: none;
      }
      canvas {
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        display: block;
      }
      #hud {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 16px;
        display: flex;
        gap: 12px;
        align-items: baseline;
        text-shadow: 0 1px 3px #000;
      }
      #filter {
        font-weight: 800;
        font-size: 18px;
        white-space: nowrap;
        padding: 4px 12px;
        border-radius: 8px;
        background: #0d69ac;
        border-bottom: 4px solid #083d63;
        text-shadow: none;
      }
      #status {
        opacity: 0.75;
      }
      #lang {
        position: fixed;
        top: 16px;
        right: 16px;
        display: flex;
        border-radius: 8px;
        overflow: hidden;
        border-bottom: 4px solid #083d63;
      }
      #lang button {
        padding: 6px 12px;
        border: 0;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      #lang button[aria-pressed="true"] {
        background: #0d69ac;
      }
      #status.error {
        color: #ff6b6b;
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <video id="video" playsinline muted></video>
    <canvas id="out"></canvas>
    <div id="hud"><span id="filter"></span><span id="status"></span></div>
    <div id="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="ru" aria-pressed="false">RU</button>
    </div>
    <script type="module">
      import { FaceLandmarker, FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs";

      // --- geometry ---
      const WRIST = 0;
      const THUMB_TIP = 4;
      const INDEX_TIP = 8;
      const MIDDLE_MCP = 9;
      const FINGERTIPS = [4, 8, 12, 16, 20];
      const BUNCH_RATIO = 0.45;

      const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

      // MediaPipe landmarks are normalized to the raw camera frame; the view is mirrored like a selfie.
      const toMirroredPixels = (landmarks, width, height) =>
        landmarks.map((p) => ({ x: (1 - p.x) * width, y: p.y * height }));

      const sortLeftToRight = (hands) => [...hands].sort((a, b) => a[WRIST].x - b[WRIST].x);

      const smoothHands = (prev, next, alpha) =>
        prev.length !== next.length
          ? next
          : next.map((hand, h) =>
              hand.map((p, i) => ({
                x: prev[h][i].x + (p.x - prev[h][i].x) * alpha,
                y: prev[h][i].y + (p.y - prev[h][i].y) * alpha,
              })),
            );

      // Quad spanned by both "L" gestures: index tips on top, thumb tips at the bottom.
      const portalQuad = ([left, right]) => [
        left[INDEX_TIP],
        right[INDEX_TIP],
        right[THUMB_TIP],
        left[THUMB_TIP],
      ];

      // All five fingertips pinched together around their centroid.
      const isBunched = (hand) => {
        const tips = FINGERTIPS.map((i) => hand[i]);
        const center = {
          x: tips.reduce((s, p) => s + p.x, 0) / tips.length,
          y: tips.reduce((s, p) => s + p.y, 0) / tips.length,
        };
        const handSize = dist(hand[WRIST], hand[MIDDLE_MCP]);
        return tips.every((p) => dist(p, center) < handSize * BUNCH_RATIO);
      };

      // --- filters ---
      // "Roblox Avatar" draws on top of the plain video; every other filter is shader mode (index - 1).
      const AVATAR = 0;
      const FILTERS = ["Roblox Avatar", "Studs", "Noob", "Toon", "Voxel", "Neon Obby", "Lava", "Oof", "BrickColor", "Baseplate"];

      const VERTEX = `
      attribute vec2 a_pos;
      varying vec2 v_uv;
      void main() {
        // Mirror horizontally to match the selfie view; texture row 0 is the top of the frame.
        v_uv = vec2(0.5 - 0.5 * a_pos.x, 0.5 - 0.5 * a_pos.y);
        gl_Position = vec4(a_pos, 0.0, 1.0);
      }`;

      const FRAGMENT = `
      precision mediump float;
      uniform sampler2D u_tex;
      uniform vec2 u_texel;
      uniform int u_mode;
      uniform float u_time;
      varying vec2 v_uv;

      float luma(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
      float lumaAt(vec2 uv) { return luma(texture2D(u_tex, uv).rgb); }

      float sobel(vec2 uv) {
        vec2 d = u_texel * 1.5;
        float tl = lumaAt(uv + vec2(-d.x, -d.y)), t = lumaAt(uv + vec2(0.0, -d.y)), tr = lumaAt(uv + vec2(d.x, -d.y));
        float l = lumaAt(uv + vec2(-d.x, 0.0)), r = lumaAt(uv + vec2(d.x, 0.0));
        float bl = lumaAt(uv + vec2(-d.x, d.y)), b = lumaAt(uv + vec2(0.0, d.y)), br = lumaAt(uv + vec2(d.x, d.y));
        float gx = tr + 2.0 * r + br - tl - 2.0 * l - bl;
        float gy = bl + 2.0 * b + br - tl - 2.0 * t - tr;
        return length(vec2(gx, gy));
      }

      // Square blocks measured in screen pixels; returns the block-center sample and the position inside the block.
      vec3 blockColor(float px, out vec2 local) {
        vec2 block = u_texel * px;
        vec2 cell = floor(v_uv / block);
        local = fract(v_uv / block);
        return texture2D(u_tex, (cell + 0.5) * block).rgb;
      }

      vec3 posterize(vec3 c, float steps) { return floor(c * steps + 0.5) / steps; }

      // Nearest classic BrickColor.
      vec3 nearest(vec3 c, vec3 best, vec3 cand) { return distance(c, cand) < distance(c, best) ? cand : best; }
      vec3 brickColor(vec3 c) {
        vec3 b = vec3(0.95, 0.95, 0.95);              // White
        b = nearest(c, b, vec3(0.64, 0.64, 0.64));    // Medium stone grey
        b = nearest(c, b, vec3(0.39, 0.37, 0.38));    // Dark stone grey
        b = nearest(c, b, vec3(0.11, 0.16, 0.20));    // Black
        b = nearest(c, b, vec3(0.77, 0.16, 0.11));    // Bright red
        b = nearest(c, b, vec3(0.85, 0.52, 0.25));    // Bright orange
        b = nearest(c, b, vec3(0.96, 0.80, 0.19));    // Bright yellow (noob head)
        b = nearest(c, b, vec3(0.80, 0.56, 0.41));    // Nougat
        b = nearest(c, b, vec3(0.49, 0.36, 0.27));    // Reddish brown
        b = nearest(c, b, vec3(0.29, 0.59, 0.29));    // Bright green
        b = nearest(c, b, vec3(0.64, 0.74, 0.28));    // Br. yellowish green (noob legs)
        b = nearest(c, b, vec3(0.05, 0.41, 0.67));    // Bright blue (noob torso)
        b = nearest(c, b, vec3(0.50, 0.73, 0.86));    // Pastel blue
        b = nearest(c, b, vec3(0.42, 0.20, 0.48));    // Bright violet
        return b;
      }

      void main() {
        vec3 c = texture2D(u_tex, v_uv).rgb;
        float y = luma(c);
        vec3 o;
        if (u_mode < 0) o = c;
        else if (u_mode == 0) {
          // Studs: bricks with a raised stud in every cell.
          vec2 f;
          o = blockColor(22.0, f);
          vec2 p = f - 0.5;
          float r = length(p);
          float stud = 1.0 - smoothstep(0.30, 0.33, r);
          float rim = dot(normalize(p + 1e-4), vec2(-0.707, -0.707));
          o *= 1.0 + stud * rim * 0.35 * smoothstep(0.18, 0.31, r);
          float edge = min(min(f.x, f.y), min(1.0 - f.x, 1.0 - f.y));
          o *= mix(0.72, 1.0, smoothstep(0.0, 0.06, edge));
        }
        else if (u_mode == 1) {
          // Noob: dark -> green legs, mid -> blue torso, bright -> yellow head.
          vec3 green = vec3(0.64, 0.74, 0.28), blue = vec3(0.05, 0.41, 0.67), yellow = vec3(0.96, 0.80, 0.19);
          o = y < 0.33 ? green : (y < 0.6 ? blue : yellow);
          o *= 0.8 + 0.2 * smoothstep(0.0, 1.0, y);
          o *= 1.0 - smoothstep(0.35, 0.7, sobel(v_uv));
        }
        else if (u_mode == 2) {
          // Toon: flat cel shading with thick outlines.
          o = posterize(c * 1.15, 4.0);
          o *= 1.0 - smoothstep(0.25, 0.5, sobel(v_uv));
        }
        else if (u_mode == 3) {
          // Voxel: big beveled cubes lit from the top-left.
          vec2 f;
          o = posterize(blockColor(34.0, f), 6.0);
          float light = 1.0;
          if (f.y < 0.12 && f.y < f.x && f.y < 1.0 - f.x) light = 1.3;
          else if (f.x < 0.12 && f.x < 1.0 - f.y) light = 1.12;
          else if (f.y > 0.88) light = 0.62;
          else if (f.x > 0.88) light = 0.78;
          o *= light;
        }
        else if (u_mode == 4) {
          // Neon Obby: glowing outlines in shifting obby colors on black.
          float e = smoothstep(0.1, 0.45, sobel(v_uv));
          vec3 neon = 0.5 + 0.5 * cos(6.2832 * (v_uv.y * 0.8 + u_time * 0.25 + vec3(0.0, 0.33, 0.67)));
          o = neon * e * 1.4 + c * 0.08;
        }
        else if (u_mode == 5) {
          // Lava: the floor is lava, and so is everything else.
          float t = y + 0.06 * sin(v_uv.y * 40.0 + u_time * 4.0) * sin(v_uv.x * 30.0 - u_time * 3.0);
          o = mix(vec3(0.15, 0.0, 0.0), vec3(0.9, 0.1, 0.0), smoothstep(0.0, 0.4, t));
          o = mix(o, vec3(1.0, 0.55, 0.0), smoothstep(0.35, 0.7, t));
          o = mix(o, vec3(1.0, 0.95, 0.5), smoothstep(0.7, 1.0, t));
        }
        else if (u_mode == 6) {
          // Oof: taking damage — red flash, pulsing vignette, chromatic shake.
          float pulse = 0.5 + 0.5 * sin(u_time * 8.0);
          vec2 shift = u_texel * (4.0 + 6.0 * pulse) * vec2(1.0, 0.0);
          vec3 s = vec3(texture2D(u_tex, v_uv + shift).r, c.g, texture2D(u_tex, v_uv - shift).b);
          o = mix(s, vec3(luma(s) * 1.2, 0.0, 0.0), 0.55);
          float v = length(v_uv - 0.5);
          o = mix(o, vec3(0.8, 0.0, 0.0), smoothstep(0.25, 0.75, v) * (0.5 + 0.4 * pulse));
        }
        else if (u_mode == 7) {
          // BrickColor: low graphics quality snapped to the classic palette.
          vec2 f;
          o = brickColor(blockColor(10.0, f));
        }
        else {
          // Baseplate: grey studio baseplate with 4-stud grid lines.
          o = mix(vec3(0.35, 0.36, 0.37), vec3(0.78, 0.79, 0.80), y);
          vec2 g = fract(v_uv / (u_texel * 64.0));
          float line = step(g.x, 0.03) + step(g.y, 0.03);
          vec2 g2 = fract(v_uv / (u_texel * 16.0));
          float fine = step(g2.x, 0.08) + step(g2.y, 0.08);
          o *= 1.0 - 0.18 * clamp(line, 0.0, 1.0) - 0.06 * clamp(fine, 0.0, 1.0);
        }
        gl_FragColor = vec4(clamp(o, 0.0, 1.0), 1.0);
      }`;

      const compile = (gl, type, source) => {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
        return shader;
      };

      // Renders the whole mirrored video frame through the selected filter into an offscreen canvas.
      function createFilterRenderer(width, height) {
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const gl = canvas.getContext("webgl");
        if (!gl) throw new Error("WebGL is not available");

        const program = gl.createProgram();
        gl.attachShader(program, compile(gl, gl.VERTEX_SHADER, VERTEX));
        gl.attachShader(program, compile(gl, gl.FRAGMENT_SHADER, FRAGMENT));
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
        gl.useProgram(program);

        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
        const aPos = gl.getAttribLocation(program, "a_pos");
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

        gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

        gl.uniform2f(gl.getUniformLocation(program, "u_texel"), 1 / width, 1 / height);
        const uMode = gl.getUniformLocation(program, "u_mode");
        const uTime = gl.getUniformLocation(program, "u_time");
        gl.viewport(0, 0, width, height);

        return {
          canvas,
          render(video, mode) {
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, video);
            gl.uniform1i(uMode, mode - 1);
            gl.uniform1f(uTime, performance.now() / 1000);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          },
        };
      }

      // --- app ---

      const WASM_ROOT = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm";
      const MODEL_URL =
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
      const FACE_MODEL_URL =
        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
      const SMOOTHING = 0.55;

      const video = document.getElementById("video");
      const out = document.getElementById("out");
      const ctx = out.getContext("2d");
      const filterLabel = document.getElementById("filter");
      const statusLabel = document.getElementById("status");

      // --- language ---
      const TEXT = {
        en: {
          title: "Roblox Hand Portal",
          loading: "Loading model and camera…",
          ready: "Frame a window with both hands · pinch all five fingertips or press ←/→ to switch filters",
          faceFailed: "face tracking failed to load, Roblox Avatar is off",
          error: "Error",
          NotFoundError:
            "No camera found. Check that a webcam is connected and that the browser is allowed to use it in your system privacy settings (macOS/Windows).",
          NotAllowedError:
            "Camera access was blocked. Allow the camera for this site (icon left of the address bar) and for the browser in system privacy settings.",
          NotReadableError: "The camera is busy in another app (Zoom, Meet, OBS…) or blocked by the system.",
        },
        ru: {
          title: "Roblox-портал из ладоней",
          loading: "Загружаю модель и камеру…",
          ready: "Сложите рамку обеими руками · сведите кончики всех пяти пальцев или нажмите ←/→, чтобы сменить фильтр",
          faceFailed: "не удалось загрузить отслеживание лица, фильтр Roblox Avatar отключён",
          error: "Ошибка",
          NotFoundError:
            "Камера не найдена. Проверьте, что веб-камера подключена и браузеру разрешён доступ к ней в системных настройках конфиденциальности (macOS/Windows).",
          NotAllowedError:
            "Доступ к камере запрещён. Разрешите камеру для этого сайта (значок слева от адресной строки) и для браузера в системных настройках конфиденциальности.",
          NotReadableError: "Камера занята другим приложением (Zoom, Meet, OBS…) или заблокирована системой.",
        },
      };

      // Same key as the landing page, so the choice carries over between pages.
      const savedLang = () => {
        try {
          return localStorage.getItem("lang");
        } catch {
          return null;
        }
      };
      const saveLang = (value) => {
        try {
          localStorage.setItem("lang", value);
        } catch {}
      };

      // ?lang= in the link wins, then the visitor's saved choice, then the browser language.
      const requestedLang = new URLSearchParams(location.search).get("lang");
      let lang = TEXT[requestedLang]
        ? requestedLang
        : TEXT[savedLang()]
          ? savedLang()
          : navigator.language?.toLowerCase().startsWith("ru")
            ? "ru"
            : "en";
      const t = (key) => TEXT[lang][key];

      // The status line is kept as data so it can be re-rendered when the language changes.
      let status = { keys: ["loading"] };
      const renderStatus = () => {
        if (status.error) {
          const { error } = status;
          const message = TEXT[lang][error.name] ? `${t(error.name)} (${error.name})` : (error.message ?? String(error));
          statusLabel.textContent = `${t("error")}: ${message}`;
        } else {
          statusLabel.textContent = status.keys.map(t).join(" · ");
        }
        statusLabel.classList.toggle("error", Boolean(status.error));
      };
      const setStatus = (next) => {
        status = next;
        renderStatus();
      };

      function setLang(next) {
        lang = next;
        document.documentElement.lang = lang;
        document.title = t("title");
        document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
        renderStatus();
      }

      document.querySelectorAll("[data-lang]").forEach((b) =>
        b.addEventListener("click", () => {
          saveLang(b.dataset.lang);
          setLang(b.dataset.lang);
        }),
      );
      setLang(lang);

      let filterIndex = 0;
      const setFilter = (i) => {
        filterIndex = (i + FILTERS.length) % FILTERS.length;
        filterLabel.textContent = `${filterIndex + 1}/${FILTERS.length} · ${FILTERS[filterIndex]}`;
      };

      const filesetPromise = FilesetResolver.forVisionTasks(WASM_ROOT);

      async function createLandmarker() {
        return HandLandmarker.createFromOptions(await filesetPromise, {
          baseOptions: { modelAssetPath: MODEL_URL, delegate: "GPU" },
          runningMode: "VIDEO",
          numHands: 2,
        });
      }

      async function createFaceLandmarker() {
        return FaceLandmarker.createFromOptions(await filesetPromise, {
          baseOptions: { modelAssetPath: FACE_MODEL_URL, delegate: "GPU" },
          runningMode: "VIDEO",
          numFaces: 2,
          outputFaceBlendshapes: true,
        });
      }

      // --- roblox avatar ---
      const FACE_TOP = 10;
      const FACE_CHIN = 152;
      const FACE_LEFT = 234; // right cheek of the person, drawn on the right in the mirrored view
      const FACE_RIGHT = 454;
      const FACE_NOSE = 1;
      const FACE_POINTS = [FACE_TOP, FACE_CHIN, FACE_LEFT, FACE_RIGHT, FACE_NOSE];

      const BRICK_YELLOW = "#f5cd30";
      const BRICK_BLUE = "#0d69ac";
      const BRICK_GREEN = "#a4bd47";

      const blendshape = (categories, name) => categories?.find((c) => c.categoryName === name)?.score ?? 0;

      // Keeps only the landmarks the avatar needs, plus blink and jaw from the blendshapes.
      const toFace = (landmarks, blendshapes, width, height) => {
        const points = toMirroredPixels(FACE_POINTS.map((i) => landmarks[i]), width, height);
        const categories = blendshapes?.categories;
        return {
          points,
          // The mirrored view puts the person's left eye on the left of the screen.
          blinkLeft: blendshape(categories, "eyeBlinkLeft"),
          blinkRight: blendshape(categories, "eyeBlinkRight"),
          jaw: blendshape(categories, "jawOpen"),
        };
      };

      const lerp = (a, b, t) => a + (b - a) * t;

      const smoothFaces = (prev, next, alpha) =>
        prev.length !== next.length
          ? next
          : next.map((face, f) => ({
              points: face.points.map((p, i) => ({
                x: lerp(prev[f].points[i].x, p.x, alpha),
                y: lerp(prev[f].points[i].y, p.y, alpha),
              })),
              blinkLeft: lerp(prev[f].blinkLeft, face.blinkLeft, alpha),
              blinkRight: lerp(prev[f].blinkRight, face.blinkRight, alpha),
              jaw: lerp(prev[f].jaw, face.jaw, alpha),
            }));

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
      }

      // A brick-coloured block with a soft cylinder-style highlight.
      function drawPart(x, y, w, h, color, r) {
        roundRect(x, y, w, h, r);
        ctx.fillStyle = color;
        ctx.fill();
        const shade = ctx.createLinearGradient(x, 0, x + w, 0);
        shade.addColorStop(0, "rgba(0, 0, 0, 0.25)");
        shade.addColorStop(0.4, "rgba(255, 255, 255, 0.12)");
        shade.addColorStop(1, "rgba(0, 0, 0, 0.3)");
        ctx.fillStyle = shade;
        ctx.fill();
        ctx.lineWidth = Math.max(1, w * 0.012);
        ctx.strokeStyle = "rgba(0, 0, 0, 0.35)";
        ctx.stroke();
      }

      // Classic R6 body: blue torso, yellow arms, green legs, sized from the head and kept upright.
      function drawBody(cx, headBottom, headWidth) {
        const torsoW = headWidth * 1.7;
        const torsoH = headWidth * 1.7;
        const armW = torsoW / 2;
        const gap = headWidth * 0.04;
        const top = headBottom + gap;
        const r = headWidth * 0.04;
        drawPart(cx - torsoW / 2 - gap - armW, top, armW, torsoH, BRICK_YELLOW, r);
        drawPart(cx + torsoW / 2 + gap, top, armW, torsoH, BRICK_YELLOW, r);
        drawPart(cx - torsoW / 2, top + torsoH + gap, torsoW / 2 - gap / 2, torsoH, BRICK_GREEN, r);
        drawPart(cx + gap / 2, top + torsoH + gap, torsoW / 2 - gap / 2, torsoH, BRICK_GREEN, r);
        drawPart(cx - torsoW / 2, top, torsoW, torsoH, BRICK_BLUE, r);
      }

      // The classic yellow head with the default "Smile" face; it follows head tilt, turn, blinks and mouth.
      function drawAvatar(face) {
        const [top, chin, left, right, nose] = face.points;
        const faceW = dist(left, right);
        const faceH = dist(top, chin);
        const roll = Math.atan2(left.y - right.y, left.x - right.x);
        const axis = { x: Math.cos(roll), y: Math.sin(roll) };
        const mid = { x: (left.x + right.x) / 2, y: (left.y + right.y) / 2 };
        const yaw = Math.max(-1, Math.min(1, ((nose.x - mid.x) * axis.x + (nose.y - mid.y) * axis.y) / (faceW / 2)));

        // Big enough to hide hair and ears; the centre sits a bit above the face midpoint.
        const w = Math.max(faceW * 1.6, faceH * 1.25);
        const h = w * 0.92;
        const up = { x: Math.sin(roll), y: -Math.cos(roll) };
        const cx = (top.x + chin.x) / 2 + up.x * faceH * 0.16;
        const cy = (top.y + chin.y) / 2 + up.y * faceH * 0.16;

        drawBody(cx, cy + h / 2, w);

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(roll);

        // Head: rounded cylinder whose highlight slides as the head turns.
        roundRect(-w / 2, -h / 2, w, h, w * 0.28);
        ctx.fillStyle = BRICK_YELLOW;
        ctx.fill();
        const light = 0.5 + yaw * 0.3;
        const shade = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
        shade.addColorStop(0, "rgba(120, 80, 0, 0.35)");
        shade.addColorStop(Math.max(0.05, light - 0.15), "rgba(255, 255, 220, 0.25)");
        shade.addColorStop(Math.min(0.95, light + 0.15), "rgba(255, 255, 220, 0.1)");
        shade.addColorStop(1, "rgba(120, 80, 0, 0.35)");
        ctx.fillStyle = shade;
        ctx.fill();
        ctx.lineWidth = Math.max(1.5, w * 0.012);
        ctx.strokeStyle = "rgba(90, 60, 0, 0.45)";
        ctx.stroke();

        // Face decal, shifted and squeezed toward the side the head is turned to.
        ctx.translate(yaw * w * 0.2, 0);
        ctx.scale(1 - Math.abs(yaw) * 0.25, 1);
        ctx.fillStyle = "#111";
        const eyeX = w * 0.15;
        const eyeY = -h * 0.08;
        const eyeRx = w * 0.045;
        const eyeRy = h * 0.1;
        for (const [x, blink] of [[-eyeX, face.blinkLeft], [eyeX, face.blinkRight]]) {
          ctx.beginPath();
          ctx.ellipse(x, eyeY, eyeRx, Math.max(eyeRy * 0.12, eyeRy * (1 - blink)), 0, 0, Math.PI * 2);
          ctx.fill();
        }

        const mouthY = h * 0.1;
        const mouthW = w * 0.24;
        const open = Math.max(0, Math.min(1, (face.jaw - 0.15) / 0.5));
        ctx.lineCap = "round";
        ctx.lineWidth = w * 0.035;
        ctx.strokeStyle = "#111";
        ctx.beginPath();
        if (open > 0) {
          // Open "D" grin that grows with the real mouth.
          ctx.moveTo(-mouthW, mouthY);
          ctx.quadraticCurveTo(0, mouthY + h * (0.12 + 0.3 * open), mouthW, mouthY);
          ctx.quadraticCurveTo(0, mouthY + h * 0.04, -mouthW, mouthY);
          ctx.fill();
          ctx.stroke();
        } else {
          ctx.moveTo(-mouthW, mouthY);
          ctx.quadraticCurveTo(0, mouthY + h * 0.2, mouthW, mouthY);
          ctx.stroke();
        }
        ctx.restore();
      }

      async function openCamera() {
        // Browsers report camera failures with terse DOMException texts (Firefox: "The object can not be found here."),
        // so renderStatus swaps in a translated hint for the common error names.
        video.srcObject = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false,
        });
        await video.play();
      }

      const tracePortal = (quad) => {
        ctx.beginPath();
        quad.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
        ctx.closePath();
      };

      function drawPortal(quad, filter, faces) {
        filter.render(video, filterIndex);
        ctx.save();
        tracePortal(quad);
        ctx.clip();
        ctx.drawImage(filter.canvas, 0, 0);
        if (filterIndex === AVATAR) faces.forEach(drawAvatar);
        ctx.restore();
        tracePortal(quad);
        // Roblox Studio selection box.
        ctx.lineJoin = "round";
        ctx.lineWidth = Math.max(3, out.width / 320);
        ctx.strokeStyle = "rgb(25, 153, 255)";
        ctx.stroke();
        const handle = ctx.lineWidth * 2.2;
        ctx.fillStyle = "rgb(25, 153, 255)";
        quad.forEach((p) => ctx.fillRect(p.x - handle / 2, p.y - handle / 2, handle, handle));
      }

      function run(landmarker, faceLandmarker, filter) {
        const { width, height } = out;
        let hands = [];
        let faces = [];
        let wasBunched = false;
        let lastVideoTime = -1;

        const frame = () => {
          if (video.currentTime !== lastVideoTime) {
            lastVideoTime = video.currentTime;
            const { landmarks } = landmarker.detectForVideo(video, performance.now());
            const detected = sortLeftToRight(landmarks.map((l) => toMirroredPixels(l, width, height)));
            hands = smoothHands(hands, detected, SMOOTHING);
            const bunched = hands.some(isBunched);
            if (bunched && !wasBunched) setFilter(filterIndex + 1);
            wasBunched = bunched;

            // Face tracking only runs while the avatar filter is on.
            if (filterIndex === AVATAR && faceLandmarker) {
              const result = faceLandmarker.detectForVideo(video, performance.now());
              const detected = result.faceLandmarks.map((l, i) => toFace(l, result.faceBlendshapes[i], width, height));
              faces = smoothFaces(faces, detected, SMOOTHING);
            } else {
              faces = [];
            }
          }

          ctx.save();
          ctx.setTransform(-1, 0, 0, 1, width, 0);
          ctx.drawImage(video, 0, 0, width, height);
          ctx.restore();
          if (hands.length === 2 && !wasBunched) drawPortal(portalQuad(hands), filter, faces);

          requestAnimationFrame(frame);
        };
        requestAnimationFrame(frame);
      }

      async function start() {
        setFilter(0);
        // The avatar filter is optional: the other filters still work if the face model fails to load.
        const [landmarker, faceLandmarker] = await Promise.all([
          createLandmarker(),
          createFaceLandmarker().catch((error) => {
            console.error(error);
            return null;
          }),
          openCamera(),
        ]);
        out.width = video.videoWidth;
        out.height = video.videoHeight;
        setStatus({ keys: faceLandmarker ? ["ready"] : ["ready", "faceFailed"] });
        run(landmarker, faceLandmarker, createFilterRenderer(out.width, out.height));
      }

      addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" || e.key === " ") setFilter(filterIndex + 1);
        if (e.key === "ArrowLeft") setFilter(filterIndex - 1);
      });

      start().catch((error) => {
        console.error(error);
        setStatus({ error });
      });

    </script>
  </body>
</html>
